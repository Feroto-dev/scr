— Сколько времени в день проводит с гаджетами?
— Что для вас важнее: интересное занятие или прикладной навык на будущее?
— Ходили ли уже на кружки? Что понравилось, а что нет?

Пауза. Слушаем 70% времени, записываем ключевые слова — вернёмся к ним в презентации.`},{id:"presentation",title:"Презентация KIBERone",tagId:"t-pres",order:2,updatedAt:Date.now(),content:`KIBERone — международная кибершкола для детей от 5 до 17 лет. Мы учим не «нажимать кнопки», а создавать технологии.

— 6 направлений в год: сайты, игры, мобильные приложения, дизайн, цифровой маркетинг, нейросети и кибербезопасность.
— Группы до 12 человек, преподаватели — практикующие специалисты из IT.
— 20% теории, 80% практики: с каждого занятия ребёнок уходит с готовым мини-проектом.

Связка: «Вы говорили, что {Имя ребенка} любит игры — как раз на модуле разработки он соберёт собственную».
